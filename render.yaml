services:
  - type: web
    name: zxvsho-hoja-de-vida
    runtime: node
    plan: free
    buildCommand: npm ci && npm --prefix api ci && npm run build
    startCommand: npm --prefix api start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGO_URI
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: JWT_SECRET
        generateValue: true
