<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <script>
    (function () {
      var tema = localStorage.getItem("temaPreferido");
      if (tema) document.documentElement.setAttribute("data-theme", tema);
    })();
  </script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Miguel | Experiencias</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="css/estilos.css" />
</head>
<body>

  <header class="navbar navbar-expand-md">
    <div class="nav-container">
      <div class="logo">Miguel</div>
      <div class="nav-controles">
        <select id="temaSelect" class="selector-tema" aria-label="Elegir tema de colores">
          <option value="violeta">🟣 Violeta</option>
          <option value="gruvbox">🟠 Gruvbox</option>
          <option value="nord">🔵 Nord</option>
          <option value="tokyo-night">🌌 Tokyo Night</option>
          <option value="catppuccin">🌸 Catppuccin</option>
          <option value="kanagawa">🍃 Kanagawa</option>
        </select>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu"
          aria-controls="navMenu" aria-expanded="false" aria-label="Alternar navegación">
          <span class="navbar-toggler-icon"></span>
        </button>
      </div>
      <nav class="collapse navbar-collapse" id="navMenu">
        <ul>
          <li><a href="index.html">Inicio</a></li>
          <li><a href="sobre-mi.html">Sobre mí</a></li>
          <li><a href="estudios.html">Estudios</a></li>
          <li><a href="experiencias.html" class="activo">Experiencias</a></li>
          <li><a href="contacto.html">Contacto</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <main>
    <div class="tarjeta">
      <h2>Experiencias profesionales</h2>
      <p>Datos obtenidos desde mi API (Node.js, Express y MongoDB).</p>
    </div>

    <div id="lista">
      <div class="tarjeta"><p>Cargando...</p></div>
    </div>
  </main>

  <footer>
    <p>&copy; 2026 Miguel — Universidad de Cartagena</p>
  </footer>

  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/main.js"></script>
  <script>
    const API = 'http://localhost:3000/api/experiencias';
    const fmt = (d) => d ? new Date(d).toLocaleDateString('es-CO', { year: 'numeric', month: 'short', timeZone: 'UTC' }) : '';
    const esc = (t) => String(t ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

    fetch(API)
      .then((r) => r.json())
      .then((datos) => {
        const lista = document.getElementById('lista');
        lista.innerHTML = datos.length
          ? datos.map((e) => `
              <div class="tarjeta">
                <h2>${esc(e.cargo)} · ${esc(e.empresa)}</h2>
                <p>${fmt(e.fechaInicio)} – ${e.actual ? 'Actualidad' : fmt(e.fechaFin)}${e.ubicacion ? ' · ' + esc(e.ubicacion) : ''}</p>
                <p>${esc(e.descripcion)}</p>
                ${(e.tecnologias || []).map((t) => `<span class="etiqueta">${esc(t)}</span>`).join('')}
              </div>`).join('')
          : '<div class="tarjeta"><p>Sin experiencias registradas.</p></div>';
      })
      .catch(() => {
        document.getElementById('lista').innerHTML =
          '<div class="tarjeta"><p>API no disponible en este momento.</p></div>';
      });
  </script>
</body>
</html>
EOF
